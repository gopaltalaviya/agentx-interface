name: interface

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · format · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: pnpm}

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

      # A production build without NEXT_PUBLIC_API_URL fails on purpose (it
      # would ship a site that talks to localhost), so CI names one.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  smoke:
    name: smoke (Playwright, mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: pnpm}

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # `pnpm check:contract` is deliberately NOT here. It asks a RUNNING API
  # whether every field this repo reads still exists, which is exactly what
  # makes it worth having — and it means it belongs against a deployed
  # environment, not against a CI job with no server to ask. Running it here
  # would only be able to assert that it fails to connect.
